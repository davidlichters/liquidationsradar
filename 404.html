<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Liquidationsradar</title>
<!--
  Der Umschlag fuer die kurzen Links aus unseren Mails.

  WOZU, David am 15.09.2026:
  "Der link in der email muss viel offensichtlicher irgendwo sein. Und das mit
   dem Ort muss etwas unauffaelliger sein. liquidationsradar.de/[abc ort][a
   version], also super unauffaellig sowas wie liquidationsradar.de/aeni"

  Vorher stand in jeder Mail `liquidationsradar.de/?o=birstein`. Das verraet
  dem Empfaenger zwei Sachen, die er nicht wissen soll: dass sein Ort in der
  Adresse steckt, und dass hier jemand mitzaehlt. Vier Buchstaben verraten
  nichts.

  WIE ES FUNKTIONIERT, obwohl die Seite statisch auf GitHub Pages liegt:
  Fuer /zxka gibt es keine Datei, also liefert GitHub diese 404-Seite aus. Sie
  liest die vier Buchstaben selbst: die ersten drei sind der Ort (base26,
  17.576 Plaetze fuer unsere 12.370 Orte), der vierte ist die Mailfassung a
  bis z.

  ZWEI FEHLER, DIE HIER NAHELIEGEN UND BEIDE VERMIEDEN SIND:

  1. Weiterleiten auf `/?o=birstein`. Dann steht der Ortsname nach dem Klick
     doch in der Adresszeile, und der ganze Umbau waere Kosmetik gewesen. Ort
     und Fassung gehen deshalb durch sessionStorage, das Ziel ist die nackte
     Startseite.
  2. Zaehlen und im selben Atemzug weiterleiten. `location.replace` bricht
     laufende Anfragen ab, und `keepalive: true` hat auf der Liveseite nicht
     zuverlaessig gereicht. Ein Teil der Klicks waere lautlos verschwunden,
     und zwar der schnellere Teil, also die guten Verbindungen. Deshalb wird
     der Zaehlaufruf als Bild geschickt und sein `onload` abgewartet, bevor
     weitergeleitet wird. Hoechstens 1,2 Sekunden, dann geht es so oder so
     weiter.
-->
<style>
  html,body{margin:0;height:100%;background:#0B0C0F;color:#F2F1EC;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  div{display:grid;place-items:center;height:100%;text-align:center;padding:24px}
  a{color:#E0704A}
</style>
<div>
  <p>Einen Moment.<br>
     <noscript>Ohne JavaScript geht es hier weiter:
       <a href="/">liquidationsradar.de</a></noscript></p>
</div>
<script>
(function () {
  var pfad = location.pathname.replace(/^\/+|\/+$/g, '');
  var weg = false;
  function weiter() { if (weg) return; weg = true; location.replace('/'); }

  // Was kein Kurzcode ist, ist eine echte 404. Direkt auf die Startseite.
  if (!/^[a-z]{4}$/.test(pfad)) { weiter(); return; }

  var ortscode = pfad.slice(0, 3), fassung = pfad.slice(3);
  try { sessionStorage.setItem('lr_fassung', fassung); } catch (e) {}

  /* Zaehlen, und zwar NACHWEISLICH fertig, bevor weitergeleitet wird.

     Erster Versuch war `fetch(..., {keepalive: true})` und danach sofort
     weiterleiten. Auf dem Testserver wurde der Aufruf gezaehlt, auf der
     Liveseite nicht, und ich konnte nicht sagen warum. Eine Messstelle, bei
     der ich nicht weiss, ob sie misst, ist keine Messstelle: sie liefert
     spaeter eine Zahl, die kleiner ist als die Wahrheit, und niemand sieht
     ihr an, dass etwas fehlt.

     Ein Bild gibt uns ein Ereignis zurueck. onload heisst, der Server hat
     geantwortet, also ist gezaehlt. Der Endpunkt liefert ein 1x1-GIF, das
     ist der dafuer vorgesehene Weg. Wir warten darauf, hoechstens 1,2
     Sekunden, und gehen dann so oder so weiter. */
  function zaehlen() {
    return new Promise(function (fertig) {
      var b = new Image();
      var t = setTimeout(fertig, 1200);
      b.onload = b.onerror = function () { clearTimeout(t); fertig(); };
      b.src = 'https://liquidationsradar.goatcounter.com/count'
            + '?p=' + encodeURIComponent('/' + pfad)
            + '&t=' + encodeURIComponent('Kurzlink ' + pfad)
            + '&r=' + encodeURIComponent(document.referrer || '')
            + '&rnd=' + String(Math.random()).slice(2);
    });
  }

  var ortHolen = fetch('/codes.json', { cache: 'force-cache' })
    .then(function (r) { return r.json(); })
    .then(function (t) {
      if (t[ortscode]) {
        try { sessionStorage.setItem('lr_ort', t[ortscode]); } catch (e) {}
      }
    })
    .catch(function () {});

  Promise.all([zaehlen(), ortHolen]).then(weiter);

  // Notbremse, falls eines von beidem haengt. Der Besucher sieht dann die
  // Seite ohne seinen Ort, was besser ist als ein schwarzer Bildschirm.
  setTimeout(weiter, 2500);
})();
</script>
</html>
